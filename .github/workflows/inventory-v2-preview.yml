name: Inventory V2 Isolated Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy or remove the isolated Inventory V2 preview resources
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - cleanup

permissions:
  contents: read

concurrency:
  group: inventory-v2-isolated-preview
  cancel-in-progress: false

env:
  FEATURE_BRANCH: feat/location-inventory
  NEON_BRANCH_PREFIX: preview-inventory-v2-pr-45
  NEON_BRANCH_NAME: preview-inventory-v2-pr-45-${{ github.run_id }}-${{ github.run_attempt }}
  VERCEL_CLI_VERSION: 59.11.7

jobs:
  deploy:
    if: >-
      (github.event_name == 'pull_request' && github.action != 'closed' && github.head_ref == 'feat/location-inventory') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Require the production-based inventory branch
        run: test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "$FEATURE_BRANCH"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve the primary Neon branch
        id: neon-parent
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches?limit=100")"
          parent_id="$(jq -r '[.branches[]? | select(.primary == true)][0].id // empty' <<<"$response")"
          test -n "$parent_id"
          echo "parent_id=$parent_id" >> "$GITHUB_OUTPUT"

      - name: Retire prior Inventory V2 Neon clones
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches?limit=100")"
          branch_ids="$(jq -r --arg prefix "$NEON_BRANCH_PREFIX" \
            '.branches[]? | select(.name == $prefix or (.name | startswith($prefix + "-"))) | .id' \
            <<<"$response")"
          removed=0
          while IFS= read -r branch_id; do
            [ -z "$branch_id" ] && continue
            curl --fail --silent --show-error --request DELETE \
              --header "Authorization: Bearer $NEON_API_KEY" \
              "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$branch_id" >/dev/null
            removed=$((removed + 1))
          done <<<"$branch_ids"
          if (( removed > 0 )); then sleep 5; fi
          echo "Retired $removed prior isolated Inventory V2 Neon clone(s)." >> "$GITHUB_STEP_SUMMARY"

      - name: Set Neon branch expiry
        id: expiry
        run: echo "at=$(date -u --date '+7 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Clone the current Neon primary branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: ${{ steps.neon-parent.outputs.parent_id }}
          branch_name: ${{ env.NEON_BRANCH_NAME }}
          expires_at: ${{ steps.expiry.outputs.at }}
          prisma: true

      - name: Mask isolated database values
        run: |
          echo "::add-mask::${{ steps.neon.outputs.db_url_pooled }}"
          echo "::add-mask::${{ steps.neon.outputs.db_url }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client and apply additive migrations
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy

      - name: Capture cutover preflight without enabling production data
        id: preflight
        continue-on-error: true
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm check:inventory-v2

      - name: Run conservation, rollback, authorization, and idempotency gates
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}
          INVENTORY_V2_DATABASE_ISOLATED: 'true'
          INVENTORY_V2_INTEGRATION: '1'
          INVENTORY_V2_ENABLED: 'true'
          AUTH_SECRET: inventory-v2-github-actions-auth-secret
        run: pnpm test:inventory-v2:integration

      - name: Generate an ephemeral browser-test password
        id: e2e-secret
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"

      - name: Prepare isolated Inventory V2 browser fixtures
        id: fixture
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}
          INVENTORY_V2_DATABASE_ISOLATED: 'true'
          INVENTORY_V2_EXPECTED_DB_HOST: ${{ steps.neon.outputs.db_host_pooled }}
          INVENTORY_V2_E2E_PASSWORD: ${{ steps.e2e-secret.outputs.password }}
          INVENTORY_V2_E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          fixture="$(pnpm exec tsx scripts/prepare-inventory-v2-preview.ts)"
          echo "owner_email=$(jq -r '.ownerEmail' <<<"$fixture")" >> "$GITHUB_OUTPUT"
          echo "manager_email=$(jq -r '.managerEmail' <<<"$fixture")" >> "$GITHUB_OUTPUT"
          echo "item_id=$(jq -r '.itemId' <<<"$fixture")" >> "$GITHUB_OUTPUT"
          echo "item_name=$(jq -r '.itemName' <<<"$fixture")" >> "$GITHUB_OUTPUT"
          echo "warehouse_id=$(jq -r '.warehouseId' <<<"$fixture")" >> "$GITHUB_OUTPUT"
          echo "warehouse_name=$(jq -r '.warehouseName' <<<"$fixture")" >> "$GITHUB_OUTPUT"
          echo "sales_point_name=$(jq -r '.salesPointName' <<<"$fixture")" >> "$GITHUB_OUTPUT"
          echo "supplier_id=$(jq -r '.supplierId' <<<"$fixture")" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      - name: Link the Dashboard project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=preview --git-branch="$FEATURE_BRANCH" --token="$VERCEL_TOKEN"

      - name: Scope the isolated database and feature flag to this branch
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}
          EXPECTED_DB_HOST: ${{ steps.neon.outputs.db_host_pooled }}
        run: |
          printf '%s' "$DATABASE_URL" | vercel env add DATABASE_URL preview --git-branch "$FEATURE_BRANCH" --sensitive --force --yes --token="$VERCEL_TOKEN"
          printf '%s' "$DIRECT_URL" | vercel env add DIRECT_URL preview --git-branch "$FEATURE_BRANCH" --sensitive --force --yes --token="$VERCEL_TOKEN"
          printf '%s' 'true' | vercel env add INVENTORY_V2_DATABASE_ISOLATED preview --git-branch "$FEATURE_BRANCH" --force --yes --token="$VERCEL_TOKEN"
          printf '%s' 'true' | vercel env add INVENTORY_V2_ENABLED preview --git-branch "$FEATURE_BRANCH" --force --yes --token="$VERCEL_TOKEN"
          printf '%s' "$EXPECTED_DB_HOST" | vercel env add INVENTORY_V2_EXPECTED_DB_HOST preview --git-branch "$FEATURE_BRANCH" --force --yes --token="$VERCEL_TOKEN"
          vercel pull --yes --environment=preview --git-branch="$FEATURE_BRANCH" --token="$VERCEL_TOKEN"

      - name: Force a fresh remote Preview build
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          git checkout -B "$FEATURE_BRANCH" "$GITHUB_SHA"
          deployment="$(vercel deploy --yes --force --target=preview --token="$VERCEL_TOKEN" --json \
            --meta githubCommitRef="$FEATURE_BRANCH" \
            --meta githubCommitSha="$GITHUB_SHA")"
          url="$(jq -r '.url // empty' <<<"$deployment")"
          test -n "$url"
          if [[ "$url" != http* ]]; then url="https://$url"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Install Chromium for remote-only browser verification
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify purchase receipt persistence and sales-point isolation
        env:
          AI_PHASE2_PREVIEW_URL: ${{ steps.preview.outputs.url }}
          AI_PHASE2_VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          INVENTORY_V2_E2E_OWNER_EMAIL: ${{ steps.fixture.outputs.owner_email }}
          INVENTORY_V2_E2E_MANAGER_EMAIL: ${{ steps.fixture.outputs.manager_email }}
          INVENTORY_V2_E2E_PASSWORD: ${{ steps.e2e-secret.outputs.password }}
          INVENTORY_V2_E2E_ITEM_ID: ${{ steps.fixture.outputs.item_id }}
          INVENTORY_V2_E2E_ITEM_NAME: ${{ steps.fixture.outputs.item_name }}
          INVENTORY_V2_E2E_WAREHOUSE_ID: ${{ steps.fixture.outputs.warehouse_id }}
          INVENTORY_V2_E2E_WAREHOUSE_NAME: ${{ steps.fixture.outputs.warehouse_name }}
          INVENTORY_V2_E2E_SALES_POINT_NAME: ${{ steps.fixture.outputs.sales_point_name }}
          INVENTORY_V2_E2E_SUPPLIER_ID: ${{ steps.fixture.outputs.supplier_id }}
        run: |
          test -n "$AI_PHASE2_VERCEL_BYPASS_SECRET"
          echo "::add-mask::$AI_PHASE2_VERCEL_BYPASS_SECRET"
          pnpm exec playwright test e2e/inventory-v2-preview.spec.ts

      - name: Publish safe preview details
        if: always() && steps.preview.outputs.url != ''
        run: |
          echo "### Inventory V2 isolated preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview: ${{ steps.preview.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Neon branch: $NEON_BRANCH_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Neon expiry: ${{ steps.expiry.outputs.at }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preflight gate: ${{ steps.preflight.outcome }} (activation remains blocked until every finding is resolved)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-v2-preview-browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7

  cleanup:
    if: >-
      (github.event_name == 'pull_request' && github.action == 'closed' && github.head_ref == 'feat/location-inventory') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install the pinned Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      - name: Remove only the Inventory V2 branch overrides
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          vercel env rm DATABASE_URL preview "$FEATURE_BRANCH" --yes --project "$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN" || true
          vercel env rm DIRECT_URL preview "$FEATURE_BRANCH" --yes --project "$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN" || true
          vercel env rm INVENTORY_V2_DATABASE_ISOLATED preview "$FEATURE_BRANCH" --yes --project "$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN" || true
          vercel env rm INVENTORY_V2_ENABLED preview "$FEATURE_BRANCH" --yes --project "$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN" || true
          vercel env rm INVENTORY_V2_EXPECTED_DB_HOST preview "$FEATURE_BRANCH" --yes --project "$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN" || true

      - name: Delete only Inventory V2 Neon clones
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches?limit=100")"
          branch_ids="$(jq -r --arg prefix "$NEON_BRANCH_PREFIX" \
            '.branches[]? | select(.name == $prefix or (.name | startswith($prefix + "-"))) | .id' \
            <<<"$response")"
          while IFS= read -r branch_id; do
            [ -z "$branch_id" ] && continue
            curl --fail --silent --show-error --request DELETE \
              --header "Authorization: Bearer $NEON_API_KEY" \
              "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$branch_id" >/dev/null
          done <<<"$branch_ids"
          echo "Removed only $NEON_BRANCH_PREFIX clones and the $FEATURE_BRANCH database overrides." >> "$GITHUB_STEP_SUMMARY"
